  // Helper matching function across any GeoJSON property format
  function lookup(props) {
    if (!props) return null;
    const candidates = [
      props.ISO_A3, props.iso_a3, props.adm0_a3, props.ADM0_A3,
      props.ISO3, props.iso3, props.id, props.iso_a2
    ];
    for (let c of candidates) {
      if (c && countryData[c]) return countryData[c];
    }
    // Name fallbacks
    const n = (props.name || props.NAME || props.ADMIN || "").toLowerCase();
    for (let key in countryData) {
      if (countryData[key].name.toLowerCase() === n) return countryData[key];
    }
    return null;
  }

  function getColor(item) {
    if (!item) return '#c8d6e5';
    switch (item.type) {
      case 1: return '#e63946'; // Red - Fatherland
      case 2: return '#1d3557'; // Blue - Motherland
      case 3: return '#2a9d8f'; // Green - Complicated
      default: return '#c8d6e5';
    }
  }

  function getCategoryName(type) {
    switch (type) {
      case 1: return 'Fatherland';
      case 2: return 'Motherland';
      case 3: return 'Complicated (e.g. feminine noun from father root)';
      default: return 'Unclassified / Territory';
    }
  }

  const map = L.map('map', {
    center: [20, 0],
    zoom: 2,
    minZoom: 2,
    maxZoom: 6,
    maxBounds: [[-85, -180], [85, 180]]
  });

  const info = L.control({ position: 'topright' });
  info.onAdd = function () {
    this._div = L.DomUtil.create('div', 'info-panel');
    this.update();
    return this._div;
  };
  info.update = function (props) {
    if (!props) {
      this._div.innerHTML = '<h4>Country Classification</h4><span>Hover over a country</span>';
      return;
    }
    const item = lookup(props);
    const countryName = (item ? item.name : (props.name || props.NAME || 'Unknown'));
    if (item) {
      this._div.innerHTML = `
        <h4>${countryName}</h4>
        <b>Language:</b> ${item.lang}<br/>
        <b>Native Term:</b> <i>${item.word}</i><br/>
        <b>Category:</b> ${getCategoryName(item.type)}
      `;
    } else {
      this._div.innerHTML = `
        <h4>${countryName}</h4>
        <b>Category:</b> Unclassified / Territory
      `;
    }
  };
  info.addTo(map);

  let geojsonLayer;

  function highlightFeature(e) {
    const layer = e.target;
    layer.setStyle({
      weight: 2,
      color: '#111',
      fillOpacity: 0.95
    });
    info.update(layer.feature.properties);
  }

  function resetHighlight(e) {
    geojsonLayer.resetStyle(e.target);
    info.update();
  }

  function onEachFeature(feature, layer) {
    layer.on({
      mouseover: highlightFeature,
      mouseout: resetHighlight
    });
  }

  // Reliable GeoJSON without antimeridian artifacts
  fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
    .then(res => res.json())
    .then(geojson => {
      geojsonLayer = L.geoJson(geojson, {
        style: function (feature) {
          const item = lookup(feature.properties);
          return {
            fillColor: getColor(item),
            weight: 0.8,
            opacity: 1,
            color: '#ffffff',
            fillOpacity: 0.88
          };
        },
        onEachFeature: onEachFeature
      }).addTo(map);
    });

  const legend = L.control({ position: 'bottomleft' });
  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML = `
      <b>Classification</b><br/>
      <i style="background: #e63946"></i> Fatherland (Red)<br/>
      <i style="background: #1d3557"></i> Motherland (Blue)<br/>
      <i style="background: #2a9d8f"></i> Complicated (Green)<br/>
    `;
    return div;
  };
  legend.addTo(map);
</script>
</body>
</html>
